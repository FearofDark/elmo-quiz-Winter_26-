<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz - Spieler Ansicht</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Zentrale Konfiguration -->
  <script src="config.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    h2 { color: #0070f3; font-size: 20px; margin-top: 0; }
    input { padding: 10px; font-size: 16px; width: 60%; border-radius: 6px; border: 1px solid #444; background: #252525; color: white; margin-bottom: 15px; text-align: center; }
    .buzzer-btn { background: #ff0070; color: white; font-size: 24px; font-weight: bold; padding: 20px; width: 100%; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 0, 112, 0.4); }
    .buzzer-btn:active { background: #d9005f; transform: scale(0.98); }
    #status { margin-top: 10px; font-size: 14px; color: #aaa; }

    /* Video-Bereich für die Spieler */
    .video-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
    .vid-box { background: #161616; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
    .vid-title { font-size: 12px; background: #222; padding: 5px; color: #ccc; }
    iframe { width: 100%; height: 140px; border: none; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- SPIEL & BUZZER BEREICH -->
    <div class="card">
      <h2>🎮 Quiz Mitspieler</h2>
      <input type="text" id="spieler-name" placeholder="Dein Spielername..." value="Spieler 1">
      
      <div style="background: #252525; padding: 12px; border-radius: 6px; margin-bottom: 15px;">
        <p style="margin: 0; font-size: 11px; color: #888;">AKTUELLE FRAGE:</p>
        <h3 id="frage-text" style="margin: 5px 0 0 0; font-size: 16px;">Warte auf Spielbeginn...</h3>
      </div>

      <button class="buzzer-btn" onclick="buzzern()">🚨 BUZZERN! 🚨</button>
      <p id="status"></p>
    </div>

    <!-- VIDEO GRID (Damit sich die Spieler gegenseitig sehen) -->
    <div class="card">
      <h2>📹 Mitspieler Kameras</h2>
      <div class="video-section">
        <div class="vid-box"><div class="vid-title">Player 1</div><iframe src="https://vdo.ninja/?view=player_1&solo=1&room=DieElmigos_Stream&password=mikestinkt" allow="autoplay"></iframe></div>
        <div class="vid-box"><div class="vid-title">Player 2</div><iframe src="https://vdo.ninja/?view=player_2&solo=1&room=DieElmigos_Stream&password=mikestinkt" allow="autoplay"></iframe></div>
        <div class="vid-box"><div class="vid-title">Player 3</div><iframe src="https://vdo.ninja/?view=player_3&solo=1&room=DieElmigos_Stream&password=mikestinkt" allow="autoplay"></iframe></div>
        <div class="vid-box"><div class="vid-title">Player 4</div><iframe src="https://vdo.ninja/?view=player_4&solo=1&room=DieElmigos_Stream&password=mikestinkt" allow="autoplay"></iframe></div>
        <div class="vid-box"><div class="vid-title">Player 5</div><iframe src="https://vdo.ninja/?view=player_5&solo=1&room=DieElmigos_Stream&password=mikestinkt" allow="autoplay"></iframe></div>
        <div class="vid-box"><div class="vid-title">Player 6</div><iframe src="https://vdo.ninja/?view=player_6&solo=1&room=DieElmigos_Stream&password=mikestinkt" allow="autoplay"></iframe></div>
        <div class="vid-box"><div class="vid-title">Player 7</div><iframe src="https://vdo.ninja/?view=player_7&solo=1&room=DieElmigos_Stream&password=mikestinkt" allow="autoplay"></iframe></div>
        <div class="vid-box"><div class="vid-title">Player 8</div><iframe src="https://vdo.ninja/?view=player_8&solo=1&room=DieElmigos_Stream&password=mikestinkt" allow="autoplay"></iframe></div>
      </div>
    </div>

  </div>

  <script>
    // Supabase Client über zentrale config.js initialisieren
    const supabaseClient = supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.KEY);

    supabaseClient
      .channel('game-channel')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state' }, payload => {
        document.getElementById('frage-text').innerText = payload.new.aktuelle_frage;
        if(payload.new.buzzer_gewinner === 'Niemand') {
          document.getElementById('status').innerText = "";
        }
      })
      .subscribe();

      // In der index.html - Funktion buzzern()
async function buzzern() {
  const name = document.getElementById('spieler-name').value || "Anonym";
  
  // Trägt den Zeitstempel direkt in die Buzzer-Tabelle ein
  await supabaseClient
    .from('buzzer_log')
    .insert([{ spieler_name: name }]);

  document.getElementById('status').innerText = "Gebuzzert!";
  document.getElementById('status').style.color = "#00ff7f";
}

  </script>
</body>
</html>
