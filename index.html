<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Quiz Admin - Kamera Regie</title>
  <style>
    body { 
      font-family: sans-serif; 
      background: #121212; 
      color: white; 
      margin: 0; 
      padding: 20px; 
    }
    h1 { 
      text-align: center; 
      margin-bottom: 20px; 
      font-size: 24px;
    }
    /* Das Grid für bis zu 8 Kameras (2 Reihen à 4 Spalten oder dynamisch) */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .cam-box {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .cam-title {
      background: #252525;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }
    iframe {
      width: 100%;
      height: 200px;
      border: none;
    }
  </style>
</head>
<body>

  <h1>🎥 Quiz Admin - Kamera Regie</h1>

  <!-- Das 8er Kamera Grid -->
  <div class="video-grid">
    
    <!-- Spieler 1 -->
    <div class="cam-box">
      <div class="cam-title">Spieler 1</div>
      <iframe src="https://vdo.ninja/?view=Spieler1_ID&autoconnect&cleanoutput" allow="autoplay"></iframe>
    </div>

    <!-- Spieler 2 -->

</body>
</html>
