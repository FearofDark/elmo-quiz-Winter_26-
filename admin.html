<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Quiz Studio - Admin Regie</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js" defer></script>
</head>
<body>

  <div class="admin-wrapper">
    
    <!-- HEADER -->
    <div class="admin-header">
      <h2 style="margin: 0; color: #f43f5e; font-size: 16px;">🎬 Quiz Studio - Regie-Panel</h2>
    </div>

    <!-- OBERER BEREICH: MODUS & PUNKTE (Kompakt) -->
    <div class="admin-top-grid">
      
      <!-- Spiel Modus Switcher -->
      <div class="card" style="padding: 8px;">
        <div style="font-size: 10px; font-weight: bold; color: #38bdf8; margin-bottom: 4px;">🎮 Spielmodus</div>
        <select id="admin-game-mode" onchange="AdminPanel.setGameMode(this.value)">
          <option value="lottery">🎯 Auslosung</option>
          <option value="game1">🎮 Spiel 1</option>
          <option value="game2">🎮 Spiel 2</option>
          <option value="game3">🎮 Spiel 3</option>
          <option value="game4">🎮 Spiel 4</option>
          <option value="game5">🎮 Spiel 5</option>
          <option value="game6">🎮 Spiel 6</option>
        </select>
      </div>

      <!-- Team-Namen & Gesamtpunkte (Sehr kompakt nebeneinander) -->
      <div class="card" style="padding: 8px;">
        <div style="font-size: 10px; font-weight: bold; color: #22c55e; margin-bottom: 4px;">🏆 Team-Punkte</div>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;">
          
          <!-- Blau -->
          <div class="team-score-card" style="border-color: #38bdf840;">
            <input type="text" id="team-name-blau" oninput="AdminPanel.updateTeamName('blau', this.value)" placeholder="Blau" style="color: #38bdf8;">
            <div class="score-row">
              <button onclick="AdminPanel.addPoints('blau', -1)" style="background: #dc2626;">-</button>
              <input type="number" id="input-score-blau" onchange="AdminPanel.setExactPoints('blau', this.value)" value="0">
              <button onclick="AdminPanel.addPoints('blau', 1)" style="background: #16a34a;">+</button>
            </div>
          </div>

          <!-- Rot -->
          <div class="team-score-card" style="border-color: #ef444440;">
            <input type="text" id="team-name-rot" oninput="AdminPanel.updateTeamName('rot', this.value)" placeholder="Rot" style="color: #f87171;">
            <div class="score-row">
              <button onclick="AdminPanel.addPoints('rot', -1)" style="background: #dc2626;">-</button>
              <input type="number" id="input-score-rot" onchange="AdminPanel.setExactPoints('rot', this.value)" value="0">
              <button onclick="AdminPanel.addPoints('rot', 1)" style="background: #16a34a;">+</button>
            </div>
          </div>

          <!-- Grün -->
          <div class="team-score-card" style="border-color: #22c55e40;">
            <input type="text" id="team-name-gruen" oninput="AdminPanel.updateTeamName('gruen', this.value)" placeholder="Grün" style="color: #4ade80;">
            <div class="score-row">
              <button onclick="AdminPanel.addPoints('gruen', -1)" style="background: #dc2626;">-</button>
              <input type="number" id="input-score-gruen" onchange="AdminPanel.setExactPoints('gruen', this.value)" value="0">
              <button onclick="AdminPanel.addPoints('gruen', 1)" style="background: #16a34a;">+</button>
            </div>
          </div>

          <!-- Gelb -->
          <div class="team-score-card" style="border-color: #eab30840;">
            <input type="text" id="team-name-gelb" oninput="AdminPanel.updateTeamName('gelb', this.value)" placeholder="Gelb" style="color: #facc15;">
            <div class="score-row">
              <button onclick="AdminPanel.addPoints('gelb', -1)" style="background: #dc2626;">-</button>
              <input type="number" id="input-score-gelb" onchange="AdminPanel.setExactPoints('gelb', this.value)" value="0">
              <button onclick="AdminPanel.addPoints('gelb', 1)" style="background: #16a34a;">+</button>
            </div>
          </div>

        </div>
      </div>

    </div>

    <!-- MITTLERER BEREICH: SPIEL-STEUERUNG (PRIORITÄT) & SLOTS -->
    <div class="admin-middle-grid">

      <!-- Aktive Spiel-Steuerung (Nimmt jetzt mehr Platz ein & scrollt sauber) -->
      <div class="card" style="display: flex; flex-direction: column; overflow: hidden;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-shrink: 0;">
          <div style="font-size: 11px; font-weight: bold; color: #38bdf8;">🎬 Aktive Spiel-Steuerung (Im Vordergrund)</div>
          <button onclick="AdminPanel.unfocusPlayer()" style="background: #27272a; border: 1px solid #3f3f46; padding: 2px 6px; font-size: 9px; border-radius: 4px; color: white; cursor: pointer;">Fokus aufheben</button>
        </div>
        <div id="admin-game-specific-controls" style="background: #18181b; border: 1px solid #27272a; border-radius: 6px; padding: 8px; flex-grow: 1; overflow-y: auto; color: #f4f4f5; font-size: 11px;">
          <!-- Dynamischer Inhalt (Spiel 2 Admin-Panel etc.) -->
        </div>
      </div>

      <!-- Spieler & Slots Verwaltung -->
      <div class="card" style="display: flex; flex-direction: column; overflow: hidden; max-height: 420px;">
        <div style="font-size: 11px; font-weight: bold; color: #a855f7; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-shrink: 0;">
          <span>👥 Spieler & Slots</span>
          <span style="font-size: 9px; color: #71717a;">Max. 2 / Team</span>
        </div>
        <div id="admin-slots-list" class="slots-container"></div>
      </div>

    </div>

    <!-- UNTERER BEREICH: LIVE-TEAM-CHATS (Sehr kompakt) -->
    <div class="card" style="padding: 8px; flex-shrink: 0;">
      <div style="font-size: 10px; font-weight: bold; color: #38bdf8; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
        <span>💬 Live Team-Chat Monitore</span>
        <div style="display: flex; align-items: center; gap: 4px;">
          <span style="font-size: 9px; color: #a1a1aa;">Absender:</span>
          <input type="text" id="admin-chat-sender-name" value="Elmo" style="width: 60px; padding: 2px 4px; font-size: 10px; text-align: center; color: #f43f5e; font-weight: bold;">
        </div>
      </div>
      
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;">
        
        <!-- Blau -->
        <div class="chat-box">
          <div style="font-size: 9px; font-weight: bold; color: #60a5fa; margin-bottom: 2px;">🔵 Team Blau</div>
          <div id="chat-messages-blau" class="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input-blau" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') AdminPanel.sendAdminChat('blau')">
            <button onclick="AdminPanel.sendAdminChat('blau')">Senden</button>
          </div>
        </div>

        <!-- Rot -->
        <div class="chat-box">
          <div style="font-size: 9px; font-weight: bold; color: #f87171; margin-bottom: 2px;">🔴 Team Rot</div>
          <div id="chat-messages-rot" class="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input-rot" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') AdminPanel.sendAdminChat('rot')">
            <button onclick="AdminPanel.sendAdminChat('rot')">Senden</button>
          </div>
        </div>

        <!-- Grün -->
        <div class="chat-box">
          <div style="font-size: 9px; font-weight: bold; color: #4ade80; margin-bottom: 2px;">🟢 Team Grün</div>
          <div id="chat-messages-gruen" class="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input-gruen" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') AdminPanel.sendAdminChat('gruen')">
            <button onclick="AdminPanel.sendAdminChat('gruen')">Senden</button>
          </div>
        </div>

        <!-- Gelb -->
        <div class="chat-box">
          <div style="font-size: 9px; font-weight: bold; color: #facc15; margin-bottom: 2px;">🟡 Team Gelb</div>
          <div id="chat-messages-gelb" class="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input-gelb" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') AdminPanel.sendAdminChat('gelb')">
            <button onclick="AdminPanel.sendAdminChat('gelb')">Senden</button>
          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
