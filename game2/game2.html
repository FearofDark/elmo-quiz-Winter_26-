<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Elmo Quiz - Spiel 2 (Conquest)</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #09090b;
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }

    #g2-main-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 10px;
      position: relative;
    }

    #g2-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
  </style>
</head>
<body>

  <div id="g2-main-wrapper">
    <!-- Hier greift das Skript (game2.js) und zentriert alles perfekt -->
    <div id="g2-stage">
      <div style="color: #facc15; font-size: 16px; font-weight: bold;">Lade Spiel 2 Weltkarte...</div>
    </div>

    <!-- Mini-Reload-Button: Lädt NUR das Spiel neu, Kameras/Webcam bleiben aktiv -->
    <button onclick="window.reloadGame2Only()" style="position: absolute; bottom: 5px; left: 5px; background: #18181b; color: #a1a1aa; border: 1px solid #27272a; padding: 3px 6px; font-size: 10px; border-radius: 4px; cursor: pointer; z-index: 9999;" title="Nur das Spiel neu laden (Kameras bleiben an)">
      🔄 Spiel-Fix
    </button>
  </div>

  <!-- Supabase Client & Spiel-Logik -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game2.js"></script>
</body>
</html>
