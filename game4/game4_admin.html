<div style="display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left;">
  <div style="font-size: 13px; font-weight: bold; color: #38bdf8; border-bottom: 1px solid #27272a; padding-bottom: 6px;">
    🎧 Spiel 4 Regie-Steuerung (Playlist & Audio-Stufen)
  </div>

  <!-- Playlist & Song-Auswahl (Skipping) -->
  <div style="background: #18181b; border: 1px solid #27272a; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 11px; font-weight: bold; color: #a1a1aa; display: flex; justify-content: space-between;">
      <span>Playlist (aus Supabase):</span>
      <span id="g4-current-song-indicator" style="color: #38bdf8;">Kein Song aktiv</span>
    </div>

    <div style="display: flex; gap: 6px;">
      <select id="g4-admin-song-select" style="flex-grow: 1; background: #09090b; color: white; border: 1px solid #27272a; padding: 6px; border-radius: 4px; font-size: 11px;">
        <option value="">Lade Songs...</option>
      </select>
      <button onclick="Game4Admin.prevSong()" style="background: #27272a; color: white; border: 1px solid #3f3f46; padding: 6px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;" title="Vorheriger Song">⏮️</button>
      <button onclick="Game4Admin.nextSong()" style="background: #27272a; color: white; border: 1px solid #3f3f46; padding: 6px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;" title="Nächster Song">⏭️</button>
    </div>

    <button onclick="Game4Admin.loadSelectedSong()" style="background: #0284c7; color: white; border: none; padding: 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">
      📥 Ausgewählten Song an Spieler übertragen
    </button>
  </div>

  <!-- Stufen-Steuerung (Snippets verlängern) -->
  <div style="border-top: 1px solid #27272a; padding-top: 8px; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 11px; color: #a1a1aa; font-weight: bold;">Snippet-Stufen freigeben:</div>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;">
      <button onclick="Game4Admin.setStage(0.5, 'Stufe 1 (0.5 Sek)')" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 2px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer;">0.5s</button>
      <button onclick="Game4Admin.setStage(1.5, 'Stufe 2 (1.5 Sek)')" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 2px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer;">1.5s</button>
      <button onclick="Game4Admin.setStage(3.5, 'Stufe 3 (3.5 Sek)')" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 2px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer;">3.5s</button>
      <button onclick="Game4Admin.setStage(10.0, 'Stufe 4 (Volles Snippet)')" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 2px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer;">10s</button>
    </div>
  </div>

  <!-- Auflösung & Reset -->
  <div style="border-top: 1px solid #27272a; padding-top: 8px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; gap: 6px;">
      <button onclick="Game4Admin.revealAnswer()" style="flex: 2; background: #16a34a; color: white; border: none; padding: 6px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">
        💡 Lösung anzeigen
      </button>
      <button onclick="Game4Admin.resetGame()" style="flex: 1; background: #27272a; color: #a1a1aa; border: 1px solid #3f3f46; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer;">
        🔄 Reset
      </button>
    </div>
  </div>

  <!-- Punkte vergeben (+1 / -1) mit Live-Anzeige für alle Teams -->
  <div style="border-top: 1px solid #27272a; padding-top: 8px;">
    <div style="font-size: 11px; color: #a1a1aa; margin-bottom: 6px; display: flex; justify-content: space-between;">
      <span>Rundenpunkte vergeben (+1 / -1):</span>
      <span style="font-size: 10px; color: #71717a;">game4_state Sync</span>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;">
      
      <!-- Blau -->
      <div style="display: flex; justify-content: space-between; align-items: center; background: #18181b; border: 1px solid #3b82f640; padding: 6px 8px; border-radius: 6px;">
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 11px; color: #60a5fa; font-weight: bold;">Blau</span>
          <span style="font-size: 14px; font-weight: 900; color: white;"><span id="admin-score-blau">0</span> Pkt</span>
        </div>
        <div style="display: flex; gap: 4px;">
          <button onclick="Game4Admin.addPoints('blau', -1)" style="background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">-1</button>
          <button onclick="Game4Admin.addPoints('blau', 1)" style="background: #16a34a; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">+1</button>
        </div>
      </div>

      <!-- Rot -->
      <div style="display: flex; justify-content: space-between; align-items: center; background: #18181b; border: 1px solid #ef444440; padding: 6px 8px; border-radius: 6px;">
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 11px; color: #f87171; font-weight: bold;">Rot</span>
          <span style="font-size: 14px; font-weight: 900; color: white;"><span id="admin-score-rot">0</span> Pkt</span>
        </div>
        <div style="display: flex; gap: 4px;">
          <button onclick="Game4Admin.addPoints('rot', -1)" style="background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">-1</button>
          <button onclick="Game4Admin.addPoints('rot', 1)" style="background: #16a34a; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">+1</button>
        </div>
      </div>

      <!-- Grün -->
      <div style="display: flex; justify-content: space-between; align-items: center; background: #18181b; border: 1px solid #22c55e40; padding: 6px 8px; border-radius: 6px;">
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 11px; color: #4ade80; font-weight: bold;">Grün</span>
          <span style="font-size: 14px; font-weight: 900; color: white;"><span id="admin-score-gruen">0</span> Pkt</span>
        </div>
        <div style="display: flex; gap: 4px;">
          <button onclick="Game4Admin.addPoints('gruen', -1)" style="background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">-1</button>
          <button onclick="Game4Admin.addPoints('gruen', 1)" style="background: #16a34a; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">+1</button>
        </div>
      </div>

      <!-- Gelb -->
      <div style="display: flex; justify-content: space-between; align-items: center; background: #18181b; border: 1px solid #eab30840; padding: 6px 8px; border-radius: 6px;">
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 11px; color: #facc15; font-weight: bold;">Gelb</span>
          <span style="font-size: 14px; font-weight: 900; color: white;"><span id="admin-score-gelb">0</span> Pkt</span>
        </div>
        <div style="display: flex; gap: 4px;">
          <button onclick="Game4Admin.addPoints('gelb', -1)" style="background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">-1</button>
          <button onclick="Game4Admin.addPoints('gelb', 1)" style="background: #16a34a; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">+1</button>
        </div>
      </div>

    </div>
  </div>
</div>
