        >
        <dc:description
          >Top-down view on an enrolled condom as vector graphic. I think I’m pretty good with the use of multiple layers of gradients with partial transparency. Maybe I should write a detailed report on the topic. Originally created for the strip “Least Of My Problems” (to appear 2009-12-02T15:00Z) from my webcomic “tragicomics”. Now I make it available to use as clip art.</dc:description
